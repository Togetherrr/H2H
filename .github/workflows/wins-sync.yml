name: Wins Sync
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wins-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Call wins sync endpoint
        env:
          CRON_TARGET_URL: ${{ vars.H2H_APP_URL }}
          H2H_CRON_SECRET: ${{ secrets.H2H_CRON_SECRET }}
        run: |
          if [ -z "$CRON_TARGET_URL" ]; then
            echo "Missing repository variable H2H_APP_URL"
            exit 1
          fi

          if [ -z "$H2H_CRON_SECRET" ]; then
            echo "Missing repository secret H2H_CRON_SECRET"
            exit 1
          fi

          curl --fail --silent --show-error --max-time 120 \
            -H "authorization: Bearer $H2H_CRON_SECRET" \
            "$CRON_TARGET_URL/api/wins/sync"